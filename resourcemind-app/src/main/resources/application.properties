spring.application.name=resourcemind-app

# PostgreSQL — DATABASE_* from project-root .env (loaded at startup) or from the real environment
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secretKey=${JWT_SECRET_KEY}
#server.servlet.context-path=/api/v1

resourcemind.resource-pool.default-name=default
resourcemind.seed.total-gpus=20
resourcemind.langgraph.base-url=
resourcemind.langgraph.invoke-path=/invoke
